services:
  rscforge:
    build: .
    container_name: rscforge
    restart: unless-stopped
    ports:
      - "${RSCFORGE_HTTP_PORT:-8080}:8000"
    environment:
      RSCFORGE_DATA_DIR: /data
      RSCFORGE_USERNAME: ${RSCFORGE_USERNAME:-admin}
      RSCFORGE_PASSWORD: ${RSCFORGE_PASSWORD:-}
      RSCFORGE_EXPORT_TOKEN: ${RSCFORGE_EXPORT_TOKEN:-}
      RSCFORGE_DNS_CACHE_TTL: ${RSCFORGE_DNS_CACHE_TTL:-600}
      RSCFORGE_DNS_TIMEOUT: ${RSCFORGE_DNS_TIMEOUT:-5}
      RSCFORGE_DNS_CONCURRENCY: ${RSCFORGE_DNS_CONCURRENCY:-32}
    volumes:
      - rscforge-data:/data

volumes:
  rscforge-data:
